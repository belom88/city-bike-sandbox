default_environment: dev
project_id: 01a0e2aa-472f-7457-873c-1442b2ca24e3
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      files:
      - entity: trip_data_raw
        path: ${MELTANO_DATA_PATH}/202608-citibike-tripdata
        keys:
          - ride_id
  loaders:
  - name: target-postgres
    variant: meltanolabs
    pip_url: meltanolabs-target-postgres
  utilities:
  - name: fetch-trip-data
    namespace: fetch_trip_data
    pip_url: python-dotenv>=1.2.3 requests>=2.34.2
    commands:
      run:
        args: scripts/fetch_trip_data.py
        executable: python
